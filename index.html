<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0284c7">
<meta name="description" content="BM Water - Sistem Manajemen Depot Air Minum">
<title>BM WATER</title>

<!-- Preconnect ke Google Apps Script untuk mempercepat fetch pertama -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView" class="login-view">
  <div class="login-card">
    <div class="logo-circle">💧</div>
    <h1>BM WATER</h1>
    <p class="muted">Sistem Manajemen Depot Air Minum</p>
    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-primary" id="loginBtn">Masuk</button>
    </form>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView" class="app-view hidden">

  <header class="topbar">
    <div class="brand"><span>💧</span> BM WATER</div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="user-name" id="userName">-</div>
      <div class="user-role" id="userRole">-</div>
    </div>
    <nav class="nav" id="navMenu"></nav>
    <div class="sidebar-footer">
      <button class="btn-ghost" id="logoutBtn">Keluar</button>
    </div>
  </aside>

  <main class="content" id="content"></main>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <div class="overlay hidden" id="overlay"></div>
</div>

<!-- ================= TOAST ================= -->
<div id="toast" class="toast"></div>

<!-- ================= MODAL ================= -->
<div id="modal" class="modal-wrap hidden">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Title</h3>
      <button class="modal-close" id="modalClose" aria-label="Tutup">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
